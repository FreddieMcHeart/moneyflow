[project]
name = "moneyflow"
version = "0.1.0"
description = "Personal finance ledger: a pure core, Postgres storage, MCP read tools"
readme = "AGENTS.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "mcp>=1.30,<2",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "coverage>=7",
    "import-linter>=2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneyflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
