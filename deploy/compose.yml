# Local environment: Postgres (app database moneyflow_dev) and Metabase.
# Data lives in a bind mount under the gitignored .local/. Pinned tags, checked 2026-11-07:
# postgres 16.13 (Docker Hub, updated 2026-05-10), metabase v0.65.3 (latest GitHub release).
name: moneyflow-local

services:
  postgres:
    image: postgres:16.13
    environment:
      POSTGRES_DB: moneyflow_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MF_READER_PASSWORD: ${MF_READER_PASSWORD:?set MF_READER_PASSWORD in .env}
      MB_DB_PASSWORD: ${MB_DB_PASSWORD:?set MB_DB_PASSWORD in .env}
    volumes:
      - ../.local/pg:/var/lib/postgresql/data
      - ../deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ../deploy/postgres/reader.sql:/opt/moneyflow/reader.sql:ro
    ports:
      - "${MF_PG_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneyflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.65.3
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASSWORD:?set MB_DB_PASSWORD in .env}
    ports:
      - "${MF_MB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
